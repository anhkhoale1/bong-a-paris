services:
  postgres:
    image: postgres:17-alpine
    container_name: bong-a-paris-postgres-local
    environment:
      POSTGRES_DB: bong_a_paris_local
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - bong-a-paris-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bong_a_paris_local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bong-a-paris-postgres-data:
